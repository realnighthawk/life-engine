services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: life_test
      POSTGRES_USER: life_test
      POSTGRES_PASSWORD: local-life-test-only
    ports:
      - "127.0.0.1:56393:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_test -d life_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  minio:
    # MinIO's official images are withdrawn; this is the rebuild of the final community release the tenant chart also uses.
    image: ghcr.io/coollabsio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: life-local-test
      MINIO_ROOT_PASSWORD: local-life-minio-test-only
    ports:
      - "127.0.0.1:59003:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
